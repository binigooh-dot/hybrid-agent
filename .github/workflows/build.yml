# [CI / build] Every push and pull request: run the tests and safety drills on Windows and Linux, then build
# HybridAgent.exe on Windows and smoke-test it. A version tag (v1.2.3) - e.g. from publishing a GitHub
# Release - also attaches HybridAgent-<version>-windows-x64.zip and SHA256SUMS to that release.
# All actions are on their Node 24 versions (Node 20 is deprecated on GitHub's runners).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Time-zone data (Windows has none built in)
        run: python -m pip install tzdata
      - name: Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Safety drills
        run: python -m hybrid_agent diagnose

  windows-app:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the build tools (+ the Claude SDK, bundled so a key in settings.env just works)
        run: python -m pip install pyinstaller tzdata anthropic
      - name: Build HybridAgent.exe
        run: python scripts/build_exe.py
      - name: Smoke-test the built app
        shell: bash
        run: |
          cd dist/HybridAgent
          test -f "START HERE.txt"
          ./HybridAgent.exe --hybrid-python -X utf8 -c "import zoneinfo, sqlite3, anthropic; print('internal python ok')"
          ANTHROPIC_API_KEY=sk-ant-ci-dummy ./HybridAgent.exe --hybrid-python -X utf8 -c "from hybrid_agent.backends import build_backend; from hybrid_agent.core.config import Config; d = build_backend(Config.from_env()).describe(); print(d); assert 'claude' in d"
          ./HybridAgent.exe doctor || true       # no model on CI: the model checks are expected to fail
          ./HybridAgent.exe diagnose
      - uses: actions/upload-artifact@v6
        with:
          name: HybridAgent-windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: HybridAgent-windows
          path: out
      - name: Checksums
        run: |
          ls out/HybridAgent-*-windows-x64.zip
          cd out && sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            out/*.zip
            out/SHA256SUMS
