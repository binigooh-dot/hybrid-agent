# [CI / build] Test on real Windows, macOS and Linux, then build the self-contained app for each.
# Runs on every push and pull request; a version tag (v1.2.3) also publishes a GitHub Release
# with HybridAgent-<version>-<os>.zip, the wheel/sdist and SHA256SUMS.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build + test tools
        run: python -m pip install pyinstaller tzdata fonttools brotli
      - name: Linux sandbox (bubblewrap)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Safety drills (from source)
        run: python -m hybrid_agent diagnose
      - name: Build the app
        run: python scripts/build_exe.py
      - name: Smoke-test the built app
        shell: bash
        run: |
          cd dist/HybridAgent
          ./HybridAgent* --hybrid-python -X utf8 -c "import zoneinfo, sqlite3; print('internal python ok')"
          ./HybridAgent* doctor || true          # no model on CI: required checks are expected to fail
          ./HybridAgent* diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: HybridAgent-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python scripts/build_release.py
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and checksums
        run: |
          mkdir out && cp artifacts/*/*.zip dist/*.whl dist/*.tar.gz RELEASE_NOTES.md out/
          cd out && sha256sum *.zip *.whl *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: out/RELEASE_NOTES.md
          files: |
            out/*.zip
            out/*.whl
            out/*.tar.gz
            out/SHA256SUMS
