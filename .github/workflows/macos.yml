# [CI / macos] Test and build the macOS app - on releases and on demand (Actions tab → macos → Run workflow).
#
# Separate from build.yml because GitHub's macOS runners are capacity-constrained: a job can wait in the
# queue for a long time or never be picked up ("not acquired by Runner"), and that must not block or fail
# the Windows/Linux build and release. When it finishes on a tag it attaches its own zip to the release.
#
# Runs on the Intel image (macos-15-intel): an Intel build also runs on Apple-silicon Macs via Rosetta 2,
# so one download covers both, and the Intel pool is separate from the busy arm64 one.
name: macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: write          # attach the zip to the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller fonttools brotli
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Safety drills (from source)
        run: python -m hybrid_agent diagnose
      - name: Build the app
        run: python scripts/build_exe.py
      - name: Smoke-test the built app
        run: |
          cd dist/HybridAgent
          ./HybridAgent --hybrid-python -X utf8 -c "import zoneinfo, sqlite3; print('internal python ok')"
          ./HybridAgent diagnose
      - uses: actions/upload-artifact@v6
        with:
          name: HybridAgent-macos
          path: dist/*.zip
      - name: Attach the macOS zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
